<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Semantic Tables and Media</title>
</head>
<body>

  <!-- Semantic Table with caption -->
  <table>
    <caption>Student Roll Numbers and Names</caption>
    <thead>
      <tr>
        <th scope="col">Roll Number</th>
        <th scope="col">Name</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>201</td>
        <td>Neha</td>
      </tr>
      <tr>
        <td>202</td>
        <td>Arjun</td>
      </tr>
      <tr>
        <td>203</td>
        <td>Kavya</td>
      </tr>
    </tbody>
  </table>

  <!-- Heading between table and list -->
  <h2>List of medias</h2>

  <!-- Ordered List with semantic grouping -->
  <ol>
    <li>
      <figure>
        <img src="https://picsum.photos/id/123/200/300" alt="Random sample image">
        <figcaption>Sample Image</figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <video controls>
          <source src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <figcaption>Big Buck Bunny Video</figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <audio controls>
          <source src="http://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg" type="audio/ogg">
          Your browser does not support the audio element.
        </audio>
        <figcaption>Epoq-Lepidoptera Audio</figcaption>
      </figure>
    </li>
  </ol>

</body>
</html>
