<!DOCTYPE html>
<html>
<head>
    <title>Semantic Table and Media</title>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Roll numbers</th>
                <th>Names</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Student 1</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Student 2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Student 3</td>
            </tr>
        </tbody>
    </table>

    <h1>List of medias</h1>

    <ol>
        <li>
            <img src="https://picsum.photos/id/123/200/300" alt="Placeholder Image">
        </li>

        <li>
            <video controls>
                <source src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
            </video>
        </li>

        <li>
            <audio controls>
                <source src="http://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg" type="audio/ogg">
            </audio>
        </li>
    </ol>

</body>
</html>
