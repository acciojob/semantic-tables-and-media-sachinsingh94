<!DOCTYPE html>
<html>
<head>
    <title>Semantic Table and Media</title>
</head>
<body>

    <table>
  <thead>
    <tr>
      <th>Roll Number</th>
      <th>Name</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>01</td>
      <td>Rahul</td>
    </tr>
    <tr>
      <td>02</td>
      <td>Priya</td>
    </tr>
    <tr>
      <td>03</td>
      <td>Amit</td>
    </tr>
  </tbody>
</table>

<h2>List of medias</h2>

<ol>
  <li>
    <img src="https://picsum.photos/id/123/200/300" alt="Sample image from Picsum">
  </li>
  <li>
    <video controls>
      <source src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </li>
  <li>
    <audio controls>
      <source src="http://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg" type="audio/ogg">
      Your browser does not support the audio element.
    </audio>
  </li>
</ol>


</body>
</html>
